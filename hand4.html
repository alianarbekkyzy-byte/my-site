<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Қазақ ым-шара дактиль китапханасы (KSL)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MediaPipe dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        .mirror { transform: scaleX(-1); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex flex-wrap justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3 mb-2 sm:mb-0">
            <div class="p-2 bg-indigo-600 rounded-lg">
                <i class="fa-solid fa-hands-asl-interpreting text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wide">KazSignAI</h1>
                <p class="text-xs text-slate-400">Қазақ ым-шара тілін тану жүйесі (v2.0 Angle Vector)</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button id="cameraToggleBtn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-sm font-semibold transition flex items-center gap-2">
                <i class="fa-solid fa-video"></i> <span>Камераны қосу</span>
            </button>
        </div>
    </header>

    <main class="flex-1 grid grid-cols-1 lg:grid-cols-3 gap-6 p-6">
        
        <!-- Video & Real-time Canvas Area -->
        <div class="lg:col-span-2 flex flex-col space-y-4">
            <div class="relative bg-slate-950 rounded-2xl overflow-hidden border border-slate-800 shadow-2xl aspect-video flex items-center justify-center">
                <video id="webcam" class="hidden" playsinline></video>
                <canvas id="output_canvas" class="w-full h-full object-cover mirror"></canvas>

                <!-- Overlay indicator -->
                <div class="absolute top-4 left-4 bg-slate-900/80 backdrop-blur-md border border-slate-700 px-4 py-2 rounded-xl flex items-center gap-3">
                    <div id="statusDot" class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></div>
                    <span id="statusText" class="text-xs font-medium text-slate-300">Камера сөндірулі</span>
                </div>

                <!-- Match Badge -->
                <div class="absolute top-4 right-4 bg-indigo-900/90 backdrop-blur-md border border-indigo-500/30 px-4 py-2 rounded-xl text-right">
                    <div class="text-[10px] uppercase tracking-wider text-indigo-300 font-bold">Сәйкестік</div>
                    <div id="matchPercent" class="text-2xl font-black text-indigo-400">0%</div>
                </div>

                <!-- Recognition Result Card -->
                <div class="absolute bottom-4 left-4 right-4 bg-slate-900/90 backdrop-blur-md border border-slate-700 p-4 rounded-xl flex justify-between items-center">
                    <div>
                        <div class="text-xs text-slate-400 font-semibold uppercase">Танылған ым / сөз:</div>
                        <div id="detectedGesture" class="text-2xl font-extrabold text-amber-400 mt-1">---</div>
                    </div>
                    <button id="addWordBtn" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg text-sm transition flex items-center gap-2 shadow-lg shadow-amber-500/20">
                        <i class="fa-solid fa-plus"></i>
                        <span>Сөзге қосу</span>
                    </button>
                </div>
            </div>

            <!-- Sentence & Speech Output -->
            <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-xl flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex-1 w-full">
                    <span class="text-xs text-slate-400 block mb-1">Құрастырылған мәтін:</span>
                    <div id="sentenceText" class="text-lg font-bold text-slate-100 min-h-[28px] bg-slate-900/50 p-2 rounded border border-slate-700/50">...</div>
                </div>
                <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                    <button id="speakBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-semibold transition flex items-center gap-2">
                        <i class="fa-solid fa-volume-high"></i> Дыбыстау
                    </button>
                    <button id="clearSentenceBtn" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-lg text-sm transition">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Gesture Library & Custom Recording Panel -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 flex flex-col space-y-6">
            <div>
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle text-amber-400"></i>
                    Жаңа жест сақтау
                </h2>
                <p class="text-xs text-slate-400 mt-1">Қолыңызбен жест көрсетіп, атауын жазыңыз да «Сақтау» түймесін басыңыз.</p>
                <div class="mt-3 flex gap-2">
                    <input type="text" id="gestureNameInput" placeholder="Мысалы: А, Сәлем, Рахмет" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                    <button id="saveGestureBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold rounded-lg transition flex items-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> Сақтау
                    </button>
                </div>
            </div>

            <hr class="border-slate-700">

            <div class="flex-1 flex flex-col overflow-hidden">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-lg font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-book-open text-indigo-400"></i>
                        Жесттер кітапханасы
                    </h2>
                    <span id="gestureCount" class="text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded-full">0 жест</span>
                </div>

                <div id="gestureList" class="flex-1 overflow-y-auto space-y-2 pr-1 custom-scrollbar min-h-[250px]">
                    <!-- Gesture cards -->
                </div>
            </div>
        </div>

    </main>

    <script>
        let library = [];
        let currentAnglesVector = null;
        let isCameraActive = false;
        let camera = null;

        // UI Elements
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const cameraToggleBtn = document.getElementById('cameraToggleBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const matchPercent = document.getElementById('matchPercent');
        const detectedGesture = document.getElementById('detectedGesture');
        const gestureList = document.getElementById('gestureList');
        const gestureCount = document.getElementById('gestureCount');
        const gestureNameInput = document.getElementById('gestureNameInput');
        const saveGestureBtn = document.getElementById('saveGestureBtn');
        const sentenceText = document.getElementById('sentenceText');
        const addWordBtn = document.getElementById('addWordBtn');
        const speakBtn = document.getElementById('speakBtn');
        const clearSentenceBtn = document.getElementById('clearSentenceBtn');

        function init() {
            const saved = localStorage.getItem('ksl_gestures_v2');
            if (saved) {
                try { library = JSON.parse(saved); } catch(e) { library = []; }
            }
            renderLibrary();
        }

        function renderLibrary() {
            gestureList.innerHTML = '';
            gestureCount.innerText = `${library.length} жест`;

            if (library.length === 0) {
                gestureList.innerHTML = `
                    <div class="text-center text-slate-500 py-8 text-sm">
                        Кітапхана бос.<br>Камераны қосып, өзіңіздің алғашқы жестіңізді сақтаңыз!
                    </div>`;
                return;
            }

            library.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "bg-slate-900/80 border border-slate-700/60 rounded-xl p-3 flex justify-between items-center";
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-indigo-500/10 text-indigo-400 flex items-center justify-center font-bold text-sm">
                            ${item.name.charAt(0).toUpperCase()}
                        </div>
                        <span class="font-semibold text-sm text-slate-200">${item.name}</span>
                    </div>
                    <button onclick="deleteGesture(${index})" class="text-slate-500 hover:text-red-400 p-1.5 transition">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                `;
                gestureList.appendChild(card);
            });
        }

        window.deleteGesture = function(index) {
            library.splice(index, 1);
            localStorage.setItem('ksl_gestures_v2', JSON.stringify(library));
            renderLibrary();
        };

        // Calculate angle (degrees) between 3 points: A -> B -> C
        function getAngle(a, b, c) {
            const ab = { x: a.x - b.x, y: a.y - b.y, z: a.z - b.z };
            const cb = { x: c.x - b.x, y: c.y - b.y, z: c.z - b.z };

            const dot = (ab.x * cb.x + ab.y * cb.y + ab.z * cb.z);
            const magAB = Math.sqrt(ab.x * ab.x + ab.y * ab.y + ab.z * ab.z);
            const magCB = Math.sqrt(cb.x * cb.x + cb.y * cb.y + cb.z * cb.z);

            if (magAB * magCB === 0) return 0;

            const cosAngle = Math.max(-1, Math.min(1, dot / (magAB * magCB)));
            return Math.acos(cosAngle) * (180 / Math.PI);
        }

        // Extract 15 unique joint angle vectors from hand landmarks
        function extractAnglesVector(landmarks) {
            // Joint triplets to measure angles for all 5 fingers
            const jointTriplets = [
                // Thumb
                [0, 1, 2], [1, 2, 3], [2, 3, 4],
                // Index
                [0, 5, 6], [5, 6, 7], [6, 7, 8],
                // Middle
                [0, 9, 10], [9, 10, 11], [10, 11, 12],
                // Ring
                [0, 13, 14], [13, 14, 15], [14, 15, 16],
                // Pinky
                [0, 17, 18], [17, 18, 19], [18, 19, 20]
            ];

            return jointTriplets.map(triplet => {
                const a = landmarks[triplet[0]];
                const b = landmarks[triplet[1]];
                const c = landmarks[triplet[2]];
                return getAngle(a, b, c);
            });
        }

        // Compare two angle vectors (0 to 100% match)
        function compareAngles(vec1, vec2) {
            if (!vec1 || !vec2 || vec1.length !== vec2.length) return 0;

            let totalDiff = 0;
            for (let i = 0; i < vec1.length; i++) {
                totalDiff += Math.abs(vec1[i] - vec2[i]);
            }

            const avgDiff = totalDiff / vec1.length;
            
            // Allow up to ~30-40 degrees average deviation across joints
            let match = 100 - (avgDiff * 2.5);
            return Math.max(0, Math.min(100, Math.round(match)));
        }

        function findBestMatch(currentVec) {
            if (library.length === 0) return { name: "---", match: 0 };

            let bestMatch = { name: "Танылмады", match: 0 };
            let maxScore = 0;

            library.forEach(item => {
                const score = compareAngles(currentVec, item.angles);
                if (score > maxScore) {
                    maxScore = score;
                    bestMatch = { name: item.name, match: score };
                }
            });

            if (maxScore < 50) {
                return { name: "Танылмады", match: maxScore };
            }

            return bestMatch;
        }

        // Setup MediaPipe
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults((results) => {
            canvasElement.width = videoElement.videoWidth || 640;
            canvasElement.height = videoElement.videoHeight || 480;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                // Draw Mesh
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, { color: '#6366f1', lineWidth: 3 });
                drawLandmarks(canvasCtx, landmarks, { color: '#f59e0b', lineWidth: 1, radius: 4 });

                // Calculate Finger Angles Vector
                currentAnglesVector = extractAnglesVector(landmarks);
                const best = findBestMatch(currentAnglesVector);

                matchPercent.innerText = `${best.match}%`;
                detectedGesture.innerText = best.name;

                if (best.match >= 75) {
                    detectedGesture.className = "text-2xl font-extrabold text-emerald-400 mt-1";
                } else if (best.match >= 50) {
                    detectedGesture.className = "text-2xl font-extrabold text-amber-400 mt-1";
                } else {
                    detectedGesture.className = "text-2xl font-extrabold text-slate-400 mt-1";
                }

            } else {
                currentAnglesVector = null;
                matchPercent.innerText = '0%';
                detectedGesture.innerText = '---';
                detectedGesture.className = "text-2xl font-extrabold text-slate-500 mt-1";
            }
            canvasCtx.restore();
        });

        // Toggle Camera
        cameraToggleBtn.addEventListener('click', () => {
            if (!isCameraActive) {
                camera = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({ image: videoElement });
                    },
                    width: 640,
                    height: 480
                });
                camera.start().then(() => {
                    isCameraActive = true;
                    statusDot.className = "w-3 h-3 rounded-full bg-emerald-500 animate-pulse";
                    statusText.innerText = "Камера қосулы";
                    cameraToggleBtn.innerHTML = `<i class="fa-solid fa-video-slash"></i> <span>Сөндіру</span>`;
                    cameraToggleBtn.className = "px-4 py-2 bg-red-600 hover:bg-red-500 rounded-lg text-sm font-semibold transition flex items-center gap-2";
                });
            } else {
                if (camera) camera.stop();
                isCameraActive = false;
                statusDot.className = "w-3 h-3 rounded-full bg-red-500";
                statusText.innerText = "Камера сөндірулі";
                cameraToggleBtn.innerHTML = `<i class="fa-solid fa-video"></i> <span>Камераны қосу</span>`;
                cameraToggleBtn.className = "px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-sm font-semibold transition flex items-center gap-2";
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            }
        });

        // Save new gesture
        saveGestureBtn.addEventListener('click', () => {
            const name = gestureNameInput.value.trim();
            if (!name) {
                alert('Жест атауын жазыңыз!');
                return;
            }
            if (!currentAnglesVector) {
                alert('Камераға қолыңызды анық көрсетіңіз!');
                return;
            }

            library.push({
                name: name,
                angles: currentAnglesVector
            });

            localStorage.setItem('ksl_gestures_v2', JSON.stringify(library));
            renderLibrary();
            gestureNameInput.value = '';
            alert(`"${name}" жесті сәтті сақталды! Енді осы жесті қайталап тексеріп көрсеңіз болады.`);
        });

        // Build Sentence
        addWordBtn.addEventListener('click', () => {
            const word = detectedGesture.innerText;
            if (word === '---' || word === 'Танылмады') return;

            if (sentenceText.innerText === '...') {
                sentenceText.innerText = word;
            } else {
                sentenceText.innerText += ' ' + word;
            }
        });

        clearSentenceBtn.addEventListener('click', () => {
            sentenceText.innerText = '...';
        });

        // Text To Speech
        speakBtn.addEventListener('click', () => {
            const text = sentenceText.innerText;
            if (!text || text === '...') return;

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'kk-KZ';
            window.speechSynthesis.speak(utterance);
        });

        init();
    </script>
</body>
</html>
